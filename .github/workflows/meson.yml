name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Install build dependencies
      run: |
        pip install ninja
        pip install meson
        sudo apt-get update
        sudo apt-get install --yes libgl1-mesa-dev gcc-16 g++-16
    - name: Setup project build directory
      env:
        CC: gcc-16
        CXX: g++-16
      run: meson setup build --werror
    - name: Compile project
      run: meson compile -C build
    - name: Run tests
      run: meson test -C build
